name: backend-quality-gate

on:
  pull_request:
  push:
    branches: [main, backend, Initail-API-Layer, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts
      - name: Format check
        run: ruff format --check app tests scripts
      - name: Verify OpenAPI snapshot
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json
      - name: Test with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Build container
        run: docker build -t kizuna-signal-backend:test .
